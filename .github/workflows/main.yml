name: Build Jelly Bean ROM (Docker Method)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    # We use a Docker container to provide the legacy environment
    container:
      image: ubuntu:14.04

    steps:
      - name: Install Git and Essentials
        run: |
          # 14.04 repos are moved to old-releases.ubuntu.com
          sed -i 's/archive.ubuntu.com/old-releases.ubuntu.com/g' /etc/apt/sources.list
          sed -i 's/security.ubuntu.com/old-releases.ubuntu.com/g' /etc/apt/sources.list
          apt-get update
          apt-get install -y git-core gnupg flex bison gperf build-essential \
          zip curl zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 \
          lib32ncurses5-dev x11proto-core-dev libx11-dev lib32z-dev ccache \
          libgl1-mesa-dev libxml2-utils xsltproc unzip python openjdk-7-jdk

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Repo Tool
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          ln -sf ~/bin/repo /usr/bin/repo

      - name: Sync Source
        run: |
          git config --global user.email "you@example.com"
          git config --global user.name "Your Name"
          mkdir android && cd android
          repo init -u https://android.googlesource.com/platform/manifest -b android-4.2.2_r1
          # Convert git to https for the old manifest
          sed -i 's/git:\/\//https:\/\//g' .repo/manifests/default.xml
          repo sync -c -j4

      - name: Build ROM
        run: |
          cd android
          source build/envsetup.sh
          lunch full_arm-eng
          make -j$(nproc)

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: JB-ROM
          path: android/out/target/product/*/system.img
