name: Build Jelly Bean ROM

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    # Using latest to avoid the queue loop often found on older images
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Maximize Disk Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 2048
          swap-size-mb: 5120
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential zip curl libncurses5-dev \
          libsdl1.2-dev squashfs-tools schedtool libxml2-utils xsltproc \
          g++-multilib lib32z1-dev lib32ncurses5-dev gcc-multilib \
          python2 python-is-python2 liblz4-tool genisoimage git

      - name: Install Repo Tool
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          sudo ln -sf ~/bin/repo /usr/bin/repo

      - name: Initialize and Sync
        run: |
          git config --global user.email "build@example.com"
          git config --global user.name "Builder"
          mkdir jb-source && cd jb-source
          
          # Initialize Jelly Bean
          repo init -u https://android.googlesource.com/platform/manifest -b android-4.2.2_r1
          
          # FIX: Replace dead git:// protocol with https:// in the manifest
          sed -i 's/git:\/\//https:\/\//g' .repo/manifests/default.xml
          
          # Sync with retries to prevent timing out
          repo sync -c -j$(nproc) --force-sync --no-clone-bundle --no-tags

      - name: Build ROM
        run: |
          cd jb-source
          # Set Python 2 as default for the build script
          export PYTHON=$(which python2)
          
          source build/envsetup.sh
          
          # 'full_arm-eng' is the generic emulator build
          # Change this to your device (e.g., mako, maguro) if you have the trees
          lunch full_arm-eng
          
          make -j$(nproc)

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: JellyBean-Output
          path: jb-source/out/target/product/*/system.img
