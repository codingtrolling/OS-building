name: Build Jelly Bean ROM (AOSP Docker)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Maximize Disk Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 2048
          swap-size-mb: 10240
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Build in AOSP Container
        run: |
          cat <<EOF > build_script.sh
          set -e
          
          # Go to home dir
          cd ~
          
          # Setup Git
          git config --global user.email "builder@example.com"
          git config --global user.name "Builder"
          git config --global color.ui false

          # DOWNLOAD REPO AND FIX PYTHON PATH
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          
          # FORCE REPO TO USE PYTHON 2
          sed -i 's/python3/python/g' ~/bin/repo
          export PATH=~/bin:\$PATH

          mkdir -p jb_source && cd jb_source
          
          # Initialize Jelly Bean
          repo init -u https://android.googlesource.com/platform/manifest -b android-4.2.2_r1 --depth=1
          
          # Fix dead git links
          if [ -f .repo/manifests/default.xml ]; then
            sed -i 's/git:\/\//https:\/\//g' .repo/manifests/default.xml
          fi
          
          # Syncing
          repo sync -c -j4 --no-tags --no-clone-bundle
          
          # Build ROM
          source build/envsetup.sh
          lunch full_arm-eng
          make -j\$(nproc)
          
          # Move output to the visible workspace
          mkdir -p /build/output
          cp out/target/product/generic/*.img /build/output/ 2>/dev/null || true
          EOF

          chmod +x build_script.sh
          
          # Run container as root
          docker run --privileged -u root -v \$(pwd):/build -w /build kylemanna/aosp /bin/bash ./build_script.sh

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: JellyBean-Images
          path: output/*.img
