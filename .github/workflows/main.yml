name: Build Jelly Bean ROM (AOSP Docker)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Maximize Disk Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 2048
          swap-size-mb: 5120
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Build in AOSP Container
        run: |
          # We run the commands inside a container that ALREADY works
          docker run --privileged -v $(pwd):/build kylemanna/aosp /bin/bash -c "
            git config --global user.email 'you@example.com'
            git config --global user.name 'Your Name'
            
            mkdir -p jb_source && cd jb_source
            
            # Initialize
            repo init -u https://android.googlesource.com/platform/manifest -b android-4.2.2_r1
            
            # Fix the dead git links
            sed -i 's/git:\/\//https:\/\//g' .repo/manifests/default.xml
            
            # Sync
            repo sync -c -j4 --no-tags --no-clone-bundle
            
            # Build
            source build/envsetup.sh
            lunch full_arm-eng
            make -j$(nproc)
          "

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: JB-ROM
          path: jb_source/out/target/product/*/system.img
