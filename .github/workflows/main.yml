name: Build Jelly Bean ROM

on:
  workflow_dispatch: # Allows you to click "Run Workflow" manually
  push:
    branches:
      - main # Triggers automatically when you push to main

jobs:
  build:
    runs-on: ubuntu-20.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Maximize Disk Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 2048
          swap-size-mb: 5120
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential zip curl libstaging-allocator-dev \
          libncurses5-dev libsdl1.2-dev libesd0-dev libwxgtk3.0-gtk3-dev squashfs-tools \
          schedtool libxml2-utils xsltproc g++-multilib lib32z1-dev lib32ncurses5-dev \
          gcc-multilib python2 python-is-python2 liblz4-tool genisoimage

      - name: Install Repo Tool
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          sudo ln -sf ~/bin/repo /usr/bin/repo

      - name: Initialize and Sync Source
        run: |
          git config --global user.email "you@example.com"
          git config --global user.name "Your Name"
          mkdir android-build && cd android-build
          
          # Initialize Jelly Bean 4.2.2
          repo init -u https://android.googlesource.com/platform/manifest -b android-4.2.2_r1
          
          # CRITICAL: Fix legacy git:// URLs to https://
          if [ -f .repo/manifests/default.xml ]; then
            sed -i 's/fetch="git:\/\//fetch="https:\/\//g' .repo/manifests/default.xml
          fi
          
          # Sync (This takes 30-60 mins)
          repo sync -c -j$(nproc) --force-sync --no-clone-bundle --no-tags

      - name: Build ROM
        run: |
          cd android-build
          source build/envsetup.sh
          
          # Replace 'full_arm-eng' with your specific device combo if you have a device tree
          lunch full_arm-eng 
          
          make -j$(nproc)

      - name: Upload Output
        uses: actions/upload-artifact@v4
        with:
          name: JellyBean-ROM
          path: android-build/out/target/product/*/system.img
