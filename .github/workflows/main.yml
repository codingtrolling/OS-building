name: Build Jelly Bean ROM (AOSP Docker)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Maximize Disk Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 2048
          swap-size-mb: 10240
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Build in AOSP Container
        run: |
          cat <<'EOF' > build_script.sh
          set -e
          cd ~
          
          git config --global user.email "builder@example.com"
          git config --global user.name "Builder"
          git config --global color.ui false

          mkdir -p ~/bin
          # Use legacy repo-1 for Python 2.7 compatibility
          curl https://storage.googleapis.com/git-repo-downloads/repo-1 > ~/bin/repo
          chmod a+x ~/bin/repo
          export PATH=~/bin:$PATH

          mkdir -p jb_source && cd jb_source
          
          # Initialize Jelly Bean 4.2.2
          repo init -u https://android.googlesource.com/platform/manifest -b android-4.2.2_r1 --depth=1
          
          # Fix dead git links
          if [ -f .repo/manifests/default.xml ]; then
            sed -i 's/git:\/\//https:\/\//g' .repo/manifests/default.xml
          fi
          
          # Sync
          repo sync -c -j4 --no-tags --no-clone-bundle
          
          # Setup Environment
          source build/envsetup.sh
          lunch full_arm-eng
          
          # TARGET: otapackage creates the flashable .zip
          make -j4 otapackage
          
          # Move the ZIP to the output folder
          mkdir -p /build/output
          cp out/target/product/generic/full_arm-ota-*.zip /build/output/rom.zip 2>/dev/null || true
          EOF

          chmod +x build_script.sh
          docker run --privileged -u root -v $(pwd):/build -w /build kylemanna/aosp /bin/bash ./build_script.sh

      - name: Upload Flashable ROM
        uses: actions/upload-artifact@v4
        with:
          name: JellyBean-Flashable-ZIP
          path: output/rom.zip
