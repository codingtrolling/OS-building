name: Build Jelly Bean ROM (Space-Saving)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Maximize Disk Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 1024
          swap-size-mb: 10240
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true' # Extra space cleanup

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Build in AOSP Container
        run: |
          cat <<'EOF' > build_script.sh
          set -e
          cd ~
          
          git config --global user.email "builder@example.com"
          git config --global user.name "Builder"

          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo-1 > ~/bin/repo
          chmod a+x ~/bin/repo
          export PATH=~/bin:$PATH

          mkdir -p jb_source && cd jb_source
          
          # Initialize with minimal history
          repo init -u https://android.googlesource.com/platform/manifest -b android-4.2.2_r1 --depth=1
          
          sed -i 's/git:\/\//https:\/\//g' .repo/manifests/default.xml
          
          # Sync
          repo sync -c -j4 --no-tags --no-clone-bundle
          
          # --- SPACE SAVING MANEUVER ---
          # Delete the .repo folder (approx 20GB-30GB) 
          # Warning: You can't "repo sync" again after this, but we have the files we need.
          rm -rf .repo
          # -----------------------------

          source build/envsetup.sh
          lunch full_arm-eng
          
          # Build only the essential images first to save space
          make -j4
          
          # Now try to make the OTA package
          make otapackage
          
          mkdir -p /build/output
          cp out/target/product/generic/full_arm-ota-*.zip /build/output/rom.zip || true
          EOF

          chmod +x build_script.sh
          docker run --privileged -u root -v $(pwd):/build -w /build kylemanna/aosp /bin/bash ./build_script.sh

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: JellyBean-Flashable-ZIP
          path: output/rom.zip
